 <script>
 let _prevPrice = -1;

 function morphPrice(val, inclTax) {
 const dollar = document.getElementById('price-dollar-sign');
 const la = document.getElementById('price-layer-a');
 const lb = document.getElementById('price-layer-b');
 if (!la || !lb) return;

 const active = val > 0;
 const newText = active
 ? (inclTax
 ? parseFloat(val.toFixed(2)).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})
 : (Math.round(val) >= 1000 ? Math.round(val).toLocaleString('en-US') : String(Math.round(val))))
 : '--';
 const newColor = active ? '#fff' : '#555';

 if (dollar) dollar.style.display = active ? 'block' : 'none';

 // First paint — no animation
 if (_prevPrice === -1) {
 la.textContent = newText;
 la.classList.remove('price-skeleton');
 la.style.color = newColor;
 la.style.opacity = '1';
 lb.style.opacity = '0';
 _prevPrice = val;
 return;
 }

 if (val === _prevPrice) return;
 const going_up = val > _prevPrice;
 _prevPrice = val;

 // Which layer is currently visible?
 const showing = parseFloat(la.style.opacity || '1') > 0.5 ? la : lb;
 const hidden = showing === la ? lb : la;

 // Pre-position hidden layer with new text
 hidden.textContent = newText;
 hidden.style.color = newColor;
 hidden.style.transform = going_up ? 'translateY(24px)' : 'translateY(-24px)';
 hidden.style.opacity = '0';
 // Make sure hidden is absolutely positioned
 hidden.style.position = 'absolute';
 hidden.style.top = '0';
 hidden.style.left = '0';

 const DUR = 480;
 const EASE = 'cubic-bezier(0.25, 0.46, 0.45, 0.94)';

 // Old number exits
 showing.animate([
 { opacity: 1, transform: 'translateY(0)' },
 { opacity: 0, transform: going_up ? 'translateY(-20px)' : 'translateY(20px)' }
 ], { duration: Math.round(DUR * 0.65), easing: EASE, fill: 'forwards' });

 // New number enters with slight delay
 hidden.animate([
 { opacity: 0, transform: going_up ? 'translateY(24px)' : 'translateY(-24px)' },
 { opacity: 1, transform: 'translateY(0)' }
 ], { duration: DUR, easing: EASE, fill: 'forwards', delay: 80 }).onfinish = () => {
 // Swap: make hidden the new showing, reset old showing
 showing.textContent = newText;
 showing.style.color = newColor;
 showing.style.opacity = '1';
 showing.style.transform = '';
 showing.style.position = la === showing ? 'block' : 'absolute';
 hidden.style.opacity = '0';
 hidden.style.transform = '';
 };
 }

 function animateStartIcon(btnEl, animClass) {
 const svg = btnEl.querySelector('svg');
 if (!svg) return;
 svg.classList.remove(animClass);
 void svg.getBoundingClientRect();
 svg.classList.add(animClass);
 svg.addEventListener('animationend', () => svg.classList.remove(animClass), { once: true });
 }

 function formatNumber(val) {
 if (!val && val !== 0) return '';
 let num = val.toString().replace(/[^0-9]/g, '');
 return num.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
 }
 function formatPrice(val) {
 if (!val && val !== 0) return '';
 return Math.round(val).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
 }

 panel.style.transition = 'transform 200ms cubic-bezier(0.4,0,1,1)';
 if (shouldDismiss) {
 panel.style.transform = 'translate3d(0,100%,0)';
 this.haptic();
 setTimeout(() => { if (d.closeFn) d.closeFn(); panel.style.transition = ''; panel.style.transform = ''; }, 200);
 } else {
 panel.style.transform = 'translate3d(0,0,0)';
 setTimeout(() => { panel.style.transition = ''; }, 200);
 }
 this.sheetDrag = { active: false, startY: 0, startT: 0, lastY: 0, lastT: 0, velocity: 0, panelEl: null, closeFn: null };
 },
 edgeSwipeStart(evt, panelOverride) {
 if (this.screen === 'START') return;
 const x = evt.touches ? evt.touches[0].clientX : evt.clientX;
 if (x > 24) return;
 const panel = panelOverride || evt.currentTarget;
 this.edgeSwipe = { active: true, startX: x, startT: performance.now(), lastX: x, lastT: performance.now(), velocity: 0, panelEl: panel, pct: 0, hapticFired: false };
 panel.style.transition = 'none';
 },
 edgeSwipeMove(evt) {
 const d = this.edgeSwipe;
 if (!d.active || !d.panelEl) return;
 const x = evt.touches ? evt.touches[0].clientX : evt.clientX;
 const now = performance.now();
 const dt = Math.max(1, now - d.lastT);
 d.velocity = (x - d.lastX) / dt;
 d.lastX = x; d.lastT = now;
 let delta = x - d.startX;
 if (delta < 0) delta = 0;
 const width = d.panelEl.offsetWidth || 1;
 d.pct = Math.min(1, delta / width);
 if (!d.hapticFired && d.pct > 0.4) { d.hapticFired = true; this.haptic(); }
 const panelEl = d.panelEl;
 if (!d.rafPending) {
 d.rafPending = true;
 requestAnimationFrame(() => {
 d.rafPending = false;
 panelEl.style.setProperty('-webkit-transform', 'translate3d(' + delta + 'px,0,0)', 'important');
 panelEl.style.setProperty('transform', 'translate3d(' + delta + 'px,0,0)', 'important');
 });
 }
 if (delta > 0 && evt.cancelable) evt.preventDefault();
 },
 edgeSwipeEnd() {
 const d = this.edgeSwipe;
 if (!d.active || !d.panelEl) return;
 const panel = d.panelEl;
 const shouldPop = d.pct > 0.4 || d.velocity > 0.5;
 panel.style.transition = 'transform 220ms cubic-bezier(0.32,0.72,0,1)';
 if (shouldPop) {
 panel.style.transform = 'translate3d(100%,0,0)';
 setTimeout(() => { this.goBack(); panel.style.transition = ''; panel.style.transform = ''; }, 220);
 } else {
 panel.style.transform = 'translate3d(0,0,0)';
 setTimeout(() => { panel.style.transition = ''; }, 220);
 }
 this.edgeSwipe = { active: false, startX: 0, startT: 0, lastX: 0, lastT: 0, velocity: 0, panelEl: null, pct: 0, hapticFired: false };
 },
 setNavHeight() {

 if (nav) document.body.style.setProperty('--nav-h', nav.offsetHeight + 'px');

 if (header) document.body.style.setProperty('--header-h', header.offsetHeight + 'px');
 },
 initNavHeight() {
 this.setNavHeight();
 window.addEventListener('resize', () => this.setNavHeight());
 },
 loadQuote() {
 try {
 const saved = sessionStorage.getItem('pricex_quote');
 if (saved) {
 const parsed = JSON.parse(saved);
 if (!Array.isArray(parsed)) { this.quoteItems = []; return; }
 // Migrate old {price} shaped items (pre tax-toggle) to {subtotal, taxIncluded}
 this.quoteItems = parsed
 .filter(i => i && typeof i === 'object' && (typeof i.subtotal === 'number' || typeof i.price === 'number'))
 .map(i => (i.subtotal !== undefined) ? i : {
 id: i.id, description: i.description, subtotal: i.price || 0, taxIncluded: false
 });
 }
 } catch(e) { this.quoteItems = []; }
 },
 copyQuote() {
 this.haptic();
 const lines = this.quoteItems.map(i => `${i.description} — $${this.itemPrice(i).toFixed(2)}`);
 const text = lines.join('\n') + `\n\nTOTAL: $${this.quoteTotal.toFixed(2)}`;
 if (navigator.clipboard) navigator.clipboard.writeText(text).catch(()=>{});
 }
 };
 }

 function runTests(ctx) { if(!ctx) return;
 // ─────────────────────────────────────────────────────────────
 // PRICEX: Golden Dataset Validation Suite (16 tests)
 // Each test calls resetAll() first to enforce full state isolation.
 // Comparisons use integer cents to avoid floating-point equality bugs.
 // ─────────────────────────────────────────────────────────────
 let passed = 0; let failed = 0;

 const run = (id, label, setup, expected) => {
 ctx.resetAll();
 setup();
 const actual = ctx.subtotal;
 const ok = Math.round(actual * 100) === Math.round(expected * 100);
 ok ? passed++ : failed++;
 console.log(
 `%c${ok ? '✅' : '❌'} ${id} | ${label} | Expected: $${expected.toFixed(2)} | Actual: $${actual.toFixed(2)}`,
 ok ? 'color:#16a34a;font-weight:bold' : 'color:#dc2626;font-weight:bold'
 );
 };

 const runFinal = (id, label, setup, taxOn, expected) => {
 ctx.resetAll();
 setup();
 ctx.includeTax = taxOn;
 const actual = ctx.finalTotal;
 const ok = Math.round(actual * 100) === Math.round(expected * 100);
 ok ? passed++ : failed++;
 console.log(
 `%c${ok ? '✅' : '❌'} ${id} | ${label} | Expected: $${expected.toFixed(2)} | Actual: $${actual.toFixed(2)}`,
 ok ? 'color:#16a34a;font-weight:bold' : 'color:#dc2626;font-weight:bold'
 );
 };

 console.log('─── PRICEX Golden Dataset ───────────────────────');

 // ── MLS Residential ──────────────────────────────────────────
 run('MLS-01', 'SqFt:2000-2999, Qty:25 → $166 (Standard Base)',
 () => { ctx.mode='MLS'; ctx.sqft='2000-2999'; ctx.selectedTier='custom'; ctx.customQty='25'; },
 166);

 run('MLS-02', 'SqFt:2000-2999, Qty:34 → $206 (Smart-Cap fires)',
 () => { ctx.mode='MLS'; ctx.sqft='2000-2999'; ctx.selectedTier='custom'; ctx.customQty='34'; },
 206);

 run('MLS-03', 'SqFt:0-1999, Qty:60 → $274 (Post-50 overage, no cap)',
 () => { ctx.mode='MLS'; ctx.sqft='0-1999'; ctx.selectedTier='custom'; ctx.customQty='60'; },
 274);

 run('MLS-04', 'SqFt:10000+, Qty:25 → $399 (Max tier base)',
 () => { ctx.mode='MLS'; ctx.sqft='10000+'; ctx.selectedTier='custom'; ctx.customQty='25'; },
 399);

 // ── PORT Portfolio ────────────────────────────────────────────
 run('PRT-01', 'BCD, Qty:2 → $149 (Brand base minimum)',
 () => { ctx.mode='PORT'; ctx.brand='BCD'; ctx.selectedTier='custom'; ctx.customQty='2'; },
 149);

 run('PRT-02', 'BCD, Qty:9 → $289 ($149 + 7×$20)',
 () => { ctx.mode='PORT'; ctx.brand='BCD'; ctx.selectedTier='custom'; ctx.customQty='9'; },
 289);

 run('PRT-03', 'BCD, Qty:10 → $299 (Decade jump flat)',
 () => { ctx.mode='PORT'; ctx.brand='BCD'; ctx.selectedTier='custom'; ctx.customQty='10'; },
 299);

 run('PRT-04', 'BCD, Qty:14 → $379 (Decade 1 + 4×$20)',
 () => { ctx.mode='PORT'; ctx.brand='BCD'; ctx.selectedTier='custom'; ctx.customQty='14'; },
 379);

 run('PRT-05', 'BCD, Qty:18 → $399 (Plateau zone — same as Qty:15)',
 () => { ctx.mode='PORT'; ctx.brand='BCD'; ctx.selectedTier='custom'; ctx.customQty='18'; },
 399);

 run('PRT-06', 'AMF, Qty:22 → $539 (Decade 2 base + 2×$20)',
 () => { ctx.mode='PORT'; ctx.brand='AMF'; ctx.selectedTier='custom'; ctx.customQty='22'; },
 539);

 // ── Add-Ons ───────────────────────────────────────────────────
 run('ADD-01', 'Virtual Staging, 3 images → $180 (Standard $60/ea)',
 () => { ctx.mode='ADD ONS'; ctx.selectedAddOn='Virtual Staging'; ctx.addOnQty=3; },
 180);

 run('ADD-02', 'Virtual Staging, 5 images → $275 (Discount $55/ea at 4+)',
 () => { ctx.mode='ADD ONS'; ctx.selectedAddOn='Virtual Staging'; ctx.addOnQty=5; },
 275);

 run('ADD-03', 'ColorPop, 4 images → $84 ($39 base + 3×$15)',
 () => { ctx.mode='ADD ONS'; ctx.selectedAddOn='ColorPop'; ctx.addOnQty=4; },
 84);

 // ── Matterport ────────────────────────────────────────────────
 // MP-01: Flat tier lookup — sqft range key 3000-3999, Standard
 run('MP-01', 'MLS Matterport, 3000-3999 sqft, Standard → $249',
 () => { ctx.mode='MLS MATTERPORT'; ctx.sqft='3000-3999'; ctx.mpService='Standard'; },
 249);

 // MP-02: Custom sqft path — user selects 6000+ bucket, enters 7000 manually.
 // calcMatterport() branches on sqft===6000 and uses mpCustomSqft x 0.06.
 run('MP-02', 'MLS Matterport, 6000+ bucket (7000 sqft entered), Standard → $420',
 () => { ctx.mode='MLS MATTERPORT'; ctx.sqft='6000'; ctx.mpCustomSqft='7000'; ctx.mpService='Standard'; },
 420);

 // ── Financial / Tax ───────────────────────────────────────────
 // FIN-01: $139 subtotal (MLS 0-1999, 25 photos) × 1.0825 = $150.4675 → rounds to $150.47
 runFinal('FIN-01', 'Tax ON: $139 × 1.0825 → $150.47',
 () => { ctx.mode='MLS'; ctx.sqft='0-1999'; ctx.selectedTier='custom'; ctx.customQty='25'; },
 true, 150.47);

 console.log(`%c\n Result: ${passed} passed, ${failed} failed out of 16 tests.`,
 failed === 0 ? 'color:#16a34a;font-size:13px;font-weight:bold' : 'color:#dc2626;font-size:13px;font-weight:bold');
 console.log('─── END PRICEX Tests ───────────────────────────');

 ctx.includeTax = true;
 ctx.resetAll();
 }
 </script>

 <div class="overflow-y-auto px-5 pb-6 flex flex-col flex-1" style="-webkit-overflow-scrolling:touch;">

 <template x-if="!wizardSqft">
 <div class="flex flex-col items-center gap-5 text-center px-4 pt-10 pb-12">
 <p class="text-[15px] font-medium text-white/60">What's the property's sq ft?</p>
 <div class="w-full rounded-[10px] px-2 transition-colors bg-red-500/15 wizard-sqft-pulse">
 <select x-model="wizardSqft" x-init="$nextTick(() => { $el.value = wizardSqft; })" @change="haptic()" class="w-full h-[60px] bg-transparent text-red-400 text-[16px] font-medium text-center outline-none appearance-none tracking-wide">
 <option value="" class="text-black">Select Sq Ft</option>
 <template x-for="opt in ['0 - 1,999', '2,000 - 2,999', '3,000 - 3,999', '4,000 - 4,999', '5,000 - 6,999', '7,000 - 9,999', '10,000+']">
 <option :value="opt.replace(/ /g, '').replace(/,/g, '')" class="text-black" x-text="opt + '  Sq Ft'"></option>
 </template>
 </select>
 </div>
 </div>
 </template>

 <template x-if="wizardSqft">
 <div class="flex flex-col flex-1 justify-center">

 <div class="flex justify-center mb-6 flex-none">
 <div class="bg-red-500 rounded-[14px] px-6 py-4 text-center">
 <p class="text-[10px] font-semibold text-white tracking-wide leading-none mb-2">Live Price</p>
 <p class="flex items-start justify-center leading-none text-white" style="letter-spacing:-0.03em;"><span class="text-[15px] font-bold" style="margin-top:5px;">$</span><span class="text-[36px] font-bold" x-text="wizardPrices().find(c=>c.key==='current').price"></span></p>
 </div>
 </div>

 <div class="grid grid-cols-2 gap-2.5 mb-6 flex-none">
 <div class="rounded-[10px] py-4 flex items-center justify-center gap-3 bg-white/[0.08]">
 <button @click="customQty=String(Math.max(mlsPackage==='MINI'?12:(mlsPackage==='FULL'?1:8),(parseInt(customQty)||(mlsPackage==='MINI'?12:(mlsPackage==='FULL'?25:8)))-1));selectedTier='custom';haptic()" class="w-[28px] h-[28px] rounded-full font-medium flex-none text-[16px] bg-white text-black">-</button>
 <span class="text-[22px] font-medium text-center text-white" style="min-width:26px;" x-text="customQty || (mlsPackage==='MINI'?12:(mlsPackage==='FULL'?25:8))"></span>
 <button @click="customQty=String((parseInt(customQty)||(mlsPackage==='MINI'?12:(mlsPackage==='FULL'?25:8)))+1);selectedTier='custom';haptic()" class="w-[28px] h-[28px] rounded-full font-medium flex-none text-[16px] bg-white text-black">+</button>
 </div>
 <div class="rounded-[10px] flex items-center justify-center px-2 bg-white/[0.08]">
 <select x-model="wizardSqft" x-init="$nextTick(() => { $el.value = wizardSqft; })" @change="haptic()" class="w-full h-[60px] bg-transparent text-white text-[16px] font-medium text-center outline-none appearance-none tracking-wide">
 <option value="" class="text-black">Select Sq Ft</option>
 <template x-for="opt in ['0 - 1,999', '2,000 - 2,999', '3,000 - 3,999', '4,000 - 4,999', '5,000 - 6,999', '7,000 - 9,999', '10,000+']">
 <option :value="opt.replace(/ /g, '').replace(/,/g, '')" class="text-black" x-text="opt + '  Sq Ft'"></option>
 </template>
 </select>
 </div>
 </div>

 <div class="grid gap-2.5 flex-none" :class="wizardPrices().length === 3 ? 'grid-cols-3' : (wizardPrices().length === 1 ? 'grid-cols-1' : 'grid-cols-2')">
 <template x-for="c in wizardPrices()" :key="c.key">
 <div class="flex flex-col justify-end h-full">
 <div :class="c.isBest ? 'border-[1.5px] border-red-500 rounded-[16px] overflow-hidden -translate-y-2' : 'border border-white/20 rounded-[14px] px-2 py-5 text-center'" :style="c.isBest ? 'box-shadow:0 6px 16px rgba(226,75,74,0.22);' : ''">
 <div x-show="c.isBest" x-cloak class="bg-red-500 py-3.5 px-2 flex items-center justify-center gap-2">
 <span class="text-[14px] font-semibold text-white">Best Pkg</span>
 <span class="w-[18px] h-[18px] rounded-full bg-white flex items-center justify-center flex-none">
 <svg class="w-[10px] h-[10px] text-black" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
 </span>
 </div>
 <div :class="c.isBest ? 'px-2 py-5 text-center' : ''">
 <p class="text-[13px] font-medium mb-2" :class="c.isBest ? 'text-white/70' : 'text-white/50'" x-text="c.label.replace(' img','')"></p>
 <p class="flex items-start justify-center leading-none text-white" style="letter-spacing:-0.02em;"><span class="font-medium" :class="c.isBest ? 'text-[11px]' : 'text-[10px]'" style="margin-top:3px;">$</span><span class="font-medium" :class="c.isBest ? 'text-[22px]' : 'text-[19px]'" x-text="c.price"></span></p>
 </div>
 </div>
 </div>
 </template>
 </div>

 <div class="grid gap-2.5 mt-2.5 flex-none" :class="wizardPrices().length === 3 ? 'grid-cols-3' : (wizardPrices().length === 1 ? 'grid-cols-1' : 'grid-cols-2')">
 <template x-for="c in wizardPrices()" :key="c.key">
 <button @click="haptic();
 if(c.key==='current'){ wizardSheetOpen=false; wizardSqft=''; }
 else if(c.key==='mini'){ mlsPackage='MINI'; sqft=''; selectedTier='custom'; customQty=String(Math.max(parseInt(customQty)||12,12)); wizardSheetOpen=false; wizardSqft=''; }
 else if(c.key==='full'){ sqft=wizardSqft; mlsPackage='FULL'; selectedTier=''; customQty=''; wizardSheetOpen=false; wizardSqft=''; $nextTick(() => { $refs.fullShootRow?.scrollIntoView({behavior:'smooth', block:'center'}); }); }"
 class="rounded-[10px] py-3.5 text-[13px] font-medium flex items-center justify-center gap-1.5 text-white" :class="c.isBest ? 'bg-red-500' : 'border border-white/25'">
 <svg x-show="c.key==='current'" class="w-3 h-3 flex-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7 7 17M7 7v10h10"/></svg>
 <span x-text="c.key==='current' ? ('Stay ' + c.label.split(' ')[0]) : (c.key==='mini' ? 'Switch to Mini' : 'Switch to Full')"></span>
 <svg x-show="c.key!=='current'" class="w-3 h-3 flex-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M7 7h10v10"/></svg>
 </button>
 </template>
 </div>

 </div>
 </template>

 </div>
 </div>


 <script>
 document.addEventListener('alpine:initialized', () => {
 try {
 const el = document.querySelector('[x-data]');
 if (el && el._x_dataStack) {
 const app = el._x_dataStack[0];
 runTests(app);
 }
 } catch(e) { console.warn('Tests skipped:', e); }
 });
 </script>
</body>
</html>
