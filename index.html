    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <style>
        html, body { height: 100%; }
        body { font-family: 'Red Hat Display', sans-serif; transition: background-color 0.3s; margin: 0; padding: 0; }
        [x-cloak] { display: none !important; }
        .app-container { height: 100dvh; width: 100%; }
        .input-container::after {
            content: attr(data-value);
            position: absolute;
            left: 0; top: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            pointer-events: none; color: #dc2626; font-weight: 900; background: transparent; z-index: 10;
        }
        .formatted-input { color: transparent !important; caret-color: #dc2626; }
        .formatted-input::placeholder { color: #fca5a5 !important; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        /* ── Shake ── */
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
        .shake-nudge { animation: shake 0.2s ease-in-out 0s 2; }

        /* ── Fade in ── */
        .fade-in { animation: fadeIn 0.25s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        /* ── Page slide transitions ── */
        @keyframes slideInRight  { from { opacity:0; transform:translateX(32px);  } to { opacity:1; transform:translateX(0); } }
        @keyframes slideOutLeft  { from { opacity:1; transform:translateX(0);     } to { opacity:0; transform:translateX(-32px); } }
        @keyframes slideInLeft   { from { opacity:0; transform:translateX(-32px); } to { opacity:1; transform:translateX(0); } }
        @keyframes slideOutRight { from { opacity:1; transform:translateX(0);     } to { opacity:0; transform:translateX(32px); } }
        @keyframes slideInUp     { from { opacity:0; transform:translateY(40px);  } to { opacity:1; transform:translateY(0); } }
        @keyframes slideOutDown  { from { opacity:1; transform:translateY(0);     } to { opacity:0; transform:translateY(40px); } }
        .screen-enter-forward { animation: slideInRight  0.28s cubic-bezier(0.22,1,0.36,1) both; }
        .screen-leave-forward { animation: slideOutLeft  0.22s cubic-bezier(0.4,0,1,1)     both; }
        .screen-enter-back    { animation: slideInLeft   0.28s cubic-bezier(0.22,1,0.36,1) both; }
        .screen-leave-back    { animation: slideOutRight 0.22s cubic-bezier(0.4,0,1,1)     both; }
        .screen-enter-up      { animation: slideInUp     0.32s cubic-bezier(0.22,1,0.36,1) both; }
        .screen-leave-down    { animation: slideOutDown  0.22s cubic-bezier(0.4,0,1,1)     both; }

        /* ── Selected tile polish ── */
        .tile-sel {
            background: #dc2626 !important;
            color: white !important;
            border-color: #dc2626 !important;
            box-shadow: inset 0 0 0 2px rgba(255,255,255,0.25), 0 4px 16px rgba(220,38,38,0.35) !important;
            transform: scale(1.02);
            transition: transform 0.18s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.18s ease;
        }
        .tile-sel-wrap { position: relative; }
        .tile-sel-wrap::after {
            content: '';
            position: absolute;
            top: 6px; right: 6px;
            width: 16px; height: 16px;
            background: white;
            border-radius: 50%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 12 12' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M2 6l3 3 5-5' stroke='%23dc2626' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
            background-size: 10px;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0;
            transform: scale(0.5);
            transition: opacity 0.15s ease, transform 0.2s cubic-bezier(0.34,1.56,0.64,1);
            pointer-events: none;
            z-index: 10;
        }
        .tile-sel-wrap.is-sel::after {
            opacity: 1;
            transform: scale(1);
        }

        /* ── Price pop animation ── */
        /* old pricePop replaced by priceRoll in price card CSS above */

        /* ── Splash screen ── */
        @keyframes splashBg   { from { opacity:0; } to { opacity:1; } }
        @keyframes splashIcon { 0% { opacity:0; transform:scale(0.7); } 70% { opacity:1; transform:scale(1.06); } 100% { opacity:1; transform:scale(1); } }
        @keyframes splashWord { 0% { opacity:0; transform:translateY(12px); } 100% { opacity:1; transform:translateY(0); } }
        @keyframes splashBar  { 0% { width:0; opacity:0; } 100% { width:48px; opacity:1; } }
        @keyframes splashSub  { 0% { opacity:0; } 100% { opacity:1; } }
        @keyframes splashExit { 0% { opacity:1; transform:translateY(0) scale(1); } 100% { opacity:0; transform:translateY(-28px) scale(0.97); } }
        .splash-bg   { animation: splashBg   0.25s ease-out forwards; }
        .splash-icon { animation: splashIcon 0.55s cubic-bezier(0.34,1.56,0.64,1) 0.1s both; }
        .splash-word { animation: splashWord 0.45s cubic-bezier(0.22,1,0.36,1) 0.35s both; }
        .splash-bar  { animation: splashBar  0.4s ease-out 0.55s both; }
        .splash-sub  { animation: splashSub  0.4s ease-out 0.7s both; }
        .splash-exit { animation: splashExit 0.45s cubic-bezier(0.4,0,1,1) forwards; }

        /* ── Active press states — all interactive elements ── */
        button:active, [role="button"]:active { transform: scale(0.96); filter: brightness(0.92); transition: transform 0.08s ease, filter 0.08s ease; }
        button { transition: transform 0.15s ease, filter 0.15s ease, background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease; }

        select, select option { text-align: center !important; text-align-last: center !important; }
        .custom-field-input { font-size: 1.875rem !important; font-weight: 900 !important; }
        .custom-field-input::placeholder { font-size: 1rem !important; font-weight: 700 !important; }
        .sqft-label-large { font-size: 1.875rem !important; font-weight: 900 !important; line-height: 1; }

        /* ── Nav bar ── */
        .nav-btn { transition: color 0.15s, transform 0.15s; }
        .nav-btn:active { transform: scale(1.2); }
        @media (hover: hover) { .nav-btn:hover { transform: scale(1.15); color: #000; } }

        /* ── Selected tile scale ── */
        .tile-selected { transform: scale(1.02); box-shadow: 0 4px 20px rgba(220,38,38,0.25); transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s ease; }

        /* ── Price card hero ── */
        .price-card-dark {
            background: #0a0a0a;
            border-color: #1a1a1a;
            position: relative;
            overflow: hidden;
        }
        /* Red radial glow behind number */
        .price-card-dark::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse 80% 90% at 50% 115%, rgba(220,38,38,0.38) 0%, transparent 70%);
            pointer-events: none;
        }
        /* Subtle scanline texture */
        .price-card-dark::after {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(255,255,255,0.015) 3px, rgba(255,255,255,0.015) 4px);
            pointer-events: none;
        }
        .price-dollar {
            color: #dc2626;
            font-family: 'Red Hat Display', sans-serif;
            font-weight: 900;
        }
        .price-number {
            color: #ffffff;
            font-family: 'Red Hat Display', sans-serif;
            font-weight: 900;
            letter-spacing: -0.02em;
        }
        .price-dash { color: #333; font-family: 'Red Hat Display', sans-serif; font-weight: 900; }

        /* Number pop + roll on change */
        @keyframes priceRoll {
            0%   { opacity: 0; transform: translateY(22px) scale(0.85); }
            65%  { opacity: 1; transform: translateY(-5px) scale(1.06); }
            82%  { transform: translateY(2px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .price-pop { animation: priceRoll 0.55s cubic-bezier(0.34, 1.2, 0.64, 1) both; }

        /* ── Nav floating pill ── */
        .nav-frosted {
            background: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            box-shadow: none;
            border-radius: 24px;
            border: 1px solid rgba(0,0,0,0.1);
        }
        .nav-pill-wrap {
            padding: 0 16px 14px 16px;
        }

        /* ── Accordion smooth collapse ── */
        .accordion-panel { overflow: hidden; }
        @keyframes accordionOpen  { from { max-height:0; opacity:0; transform:translateY(-4px); } to { max-height:200px; opacity:1; transform:translateY(0); } }
        @keyframes accordionClose { from { max-height:200px; opacity:1; } to { max-height:0; opacity:0; } }

        /* ── Header mode pill ── */
        @keyframes pillPop { 0% { opacity:0; transform:translateY(-6px) scale(0.92); } 100% { opacity:1; transform:translateY(0) scale(1); } }
        .mode-pill-enter { animation: pillPop 0.25s cubic-bezier(0.34,1.56,0.64,1) both; }

        /* ── Price skeleton shimmer ── */
        @keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
        .price-skeleton {
            background: linear-gradient(90deg, #2a2a2a 25%, #3d3d3d 50%, #2a2a2a 75%);
            background-size: 200% 100%;
            animation: shimmer 1.6s ease-in-out infinite;
            border-radius: 6px;
            color: transparent !important;
            user-select: none;
        }
        @keyframes iconShutter  { 0%,100%{transform:scale(1)}  40%{transform:scale(0.78)} 70%{transform:scale(1.08)} }
        @keyframes iconSpin     { 0%{transform:rotate(0)}      100%{transform:rotate(180deg)} }
        @keyframes iconBounce   { 0%,100%{transform:translateY(0)} 35%{transform:translateY(-10px) scale(1.12)} 65%{transform:translateY(3px)} }
        @keyframes iconSpin360  { 0%{transform:rotate(0) scale(1)} 50%{transform:rotate(180deg) scale(1.12)} 100%{transform:rotate(360deg) scale(1)} }
        @keyframes iconFlip     { 0%{transform:rotateY(0)}  50%{transform:rotateY(90deg) scale(1.1)} 100%{transform:rotateY(0)} }
        @keyframes iconWiggle   { 0%,100%{transform:rotate(0)} 20%{transform:rotate(-15deg)} 50%{transform:rotate(14deg)} 75%{transform:rotate(-8deg)} }
        .icon-shutter  { animation: iconShutter 0.28s ease-in-out; }
        .icon-spin     { animation: iconSpin    0.3s ease-in-out; }
        .icon-bounce   { animation: iconBounce  0.32s cubic-bezier(0.34,1.56,0.64,1); }
        .icon-spin360  { animation: iconSpin360 0.4s cubic-bezier(0.34,1.2,0.64,1); }
        .icon-flip     { animation: iconFlip    0.3s ease-in-out; }
        .icon-wiggle   { animation: iconWiggle  0.32s ease-in-out; }

        /* ── Frosted card layers ── */
        .card-frosted {
            box-shadow: 0 2px 12px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.07) !important;
        }
        /* Selected state overrides frosted border */
        .tile-sel.card-frosted,
        .card-frosted.tile-sel {
            border: 2px solid #dc2626 !important;
        }

        /* ── Nav active dot bounce ── */
        @keyframes dotBounce { 0%,100% { transform: scale(1); } 50% { transform: scale(1.6); } }
        .nav-dot-active { animation: dotBounce 0.3s ease; }
    </style>
    <script>
        let _prevPrice = -1;

        function morphPrice(val, inclTax) {
            const dollar = document.getElementById('price-dollar-sign');
            const la     = document.getElementById('price-layer-a');
            const lb     = document.getElementById('price-layer-b');
            if (!la || !lb) return;

            const active  = val > 0;
            const newText = active
                ? (inclTax
                    ? parseFloat(val.toFixed(2)).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})
                    : (Math.round(val) >= 1000 ? Math.round(val).toLocaleString('en-US') : String(Math.round(val))))
                : '--';
            const newColor = active ? '#fff' : '#555';

            if (dollar) dollar.style.display = active ? 'block' : 'none';

            // First paint — no animation
            if (_prevPrice === -1) {
                la.textContent = newText;
                la.classList.remove('price-skeleton');
                la.style.color = newColor;
                la.style.opacity = '1';
                lb.style.opacity = '0';
                _prevPrice = val;
                return;
            }

            if (val === _prevPrice) return;
            const going_up = val > _prevPrice;
            _prevPrice = val;

            // Which layer is currently visible?
            const showing = parseFloat(la.style.opacity || '1') > 0.5 ? la : lb;
            const hidden  = showing === la ? lb : la;

            // Pre-position hidden layer with new text
            hidden.textContent = newText;
            hidden.style.color = newColor;
            hidden.style.transform = going_up ? 'translateY(24px)' : 'translateY(-24px)';
            hidden.style.opacity = '0';
            // Make sure hidden is absolutely positioned
            hidden.style.position = 'absolute';
            hidden.style.top = '0';
            hidden.style.left = '0';

            const DUR    = 480;
            const EASE   = 'cubic-bezier(0.25, 0.46, 0.45, 0.94)';

            // Old number exits
            showing.animate([
                { opacity: 1, transform: 'translateY(0)' },
                { opacity: 0, transform: going_up ? 'translateY(-20px)' : 'translateY(20px)' }
            ], { duration: Math.round(DUR * 0.65), easing: EASE, fill: 'forwards' });

            // New number enters with slight delay
            hidden.animate([
                { opacity: 0, transform: going_up ? 'translateY(24px)' : 'translateY(-24px)' },
                { opacity: 1, transform: 'translateY(0)' }
            ], { duration: DUR, easing: EASE, fill: 'forwards', delay: 80 }).onfinish = () => {
                // Swap: make hidden the new showing, reset old showing
                showing.textContent = newText;
                showing.style.color = newColor;
                showing.style.opacity = '1';
                showing.style.transform = '';
                showing.style.position = la === showing ? 'block' : 'absolute';
                hidden.style.opacity = '0';
                hidden.style.transform = '';
            };
        }

        function animateStartIcon(btnEl, animClass) {
            const svg = btnEl.querySelector('svg');
            if (!svg) return;
            svg.classList.remove(animClass);
            void svg.getBoundingClientRect();
            svg.classList.add(animClass);
            svg.addEventListener('animationend', () => svg.classList.remove(animClass), { once: true });
        }

        function formatNumber(val) {
            if (!val && val !== 0) return '';
            let num = val.toString().replace(/[^0-9]/g, '');
            return num.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }
        function formatPrice(val) {
            if (!val && val !== 0) return '';
            return Math.round(val).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }
    </script>

            }
        },

            'PORT': {
                '0-1999': { 'Standard': 249, 'Premium': 299 }, '2000-2999': { 'Standard': 349, 'Premium': 449 }, '3000-3999': { 'Standard': 449, 'Premium': 599 }, '4000-4999': { 'Standard': 549, 'Premium': 749 }, '5000-5999': { 'Standard': 649, 'Premium': 899 }
            }
        },
        haptic() { if (window.navigator.vibrate) window.navigator.vibrate(10); },
        triggerNudge() { this.sqftError = true; this.haptic(); setTimeout(() => { this.sqftError = false; }, 400); },
        resetPrice() { 
            this.priceBreakdownOpen = false;
            this.sqft = ''; this.customQty = ''; this.selectedTier = ''; this.mpCustomSqft = ''; this.videoType = ''; this.mlsPackage = '';
            this.aerialType = ''; this.aerialQty = 0; this.planType = '2D'; this.numFloors = 1; this.mpService = 'Standard';
            this.selectedAddOn = ''; this.addOnQty = 0; this.addOnHours = '1.0'; this.addOnCategory = ''; this.brand = '';
            if (this.mode === 'AIRBNB') {
                this.selectedTier = 'custom';
                this.customQty = '12';
            }
        },
        resetAll() { this.haptic(); this.mode = 'MLS'; this.resetPrice(); this.startExpand = ''; this.navigate('START', 'back'); this.type = 'MLS'; },
        navigate(targetScreen, dir='forward') {
            this.navDir = dir;
            this.screen = targetScreen;
        },
        get qty() { 
            let cleanCustom = this.customQty.toString().replace(/,/g, '');
            if (this.selectedTier === 'custom' && cleanCustom !== '') {
                let val = parseInt(cleanCustom) || 0;
                if (this.mode === 'MLS' && this.mlsPackage === 'FULL') return val < 26 ? 26 : val;
                return val;
            }
            if (this.selectedTier.includes('-')) {
                return parseInt(this.selectedTier.split('-')[1]) || 0;
            }
            return parseInt(this.selectedTier) || 0; 
        },
        get subtotal() {
            const strategy = {
                'MLS': () => this.mlsPackage === 'MINI' ? this.calcMlsMini() : (this.mlsPackage === 'EXT' ? this.calcMlsExterior() : (this.mlsPackage === 'RESHOOT' ? this.calcMlsReshoot() : (this.mlsPackage === 'RANCH' ? this.calcMlsRanch() : this.calcMlsPhotos()))),
                'PORT': () => this.calcPortPhotos(),
                'AIRBNB': () => this.calcAirbnb(),
                'ADD ONS': () => this.calcAddOns(),
                'MLS AERIAL': () => this.calcAerial(),
                'PORT AERIAL': () => this.calcAerial(),
                'MLS VIDEO': () => this.calcVideo(),
                'PORT VIDEO': () => this.calcVideo(),
                'MLS FLOOR PLAN': () => this.calcFloorPlan(),
                'PORT FLOOR PLAN': () => this.calcFloorPlan(),
                'MLS MATTERPORT': () => this.calcMatterport(),
                'PORT MATTERPORT': () => this.calcMatterport(),
                'MLS ZILLOW 3D': () => this.calcZillow()
            };
            return (strategy[this.mode] || (() => 0))();
        },
        calcMlsPhotos() {
            let q = this.qty;
            if (q <= 0 || !this.sqft) return 0;
            
            let tiers = this.mlsPrices[this.sqft];
            if (!tiers) return 0;
            
            let baseQty = 25;
            if (q >= 50) baseQty = 50;
            else if (q >= 40) baseQty = 40;
            else if (q >= 36) baseQty = 36;
            
            let basePrice = tiers[baseQty];
            let overage = (q - baseQty) * 5;
            let calculatedPrice = basePrice + overage;
            
            // Smart-Cap Logic: Compare against the next tier base price
            let nextTierQty = null;
            if (baseQty === 25) nextTierQty = 36;
            else if (baseQty === 36) nextTierQty = 40;
            else if (baseQty === 40) nextTierQty = 50;
            
            if (nextTierQty && tiers[nextTierQty]) {
                return Math.min(calculatedPrice, tiers[nextTierQty]);
            }
            
            return calculatedPrice;
        },
        calcMlsMini() {
            // Mini: $119 base for 12 images, $10 per additional image. No SqFt required.
            let q = this.qty;
            if (q <= 0) return 0;
            return 119 + (Math.max(0, q - 12) * 10);
        },
        calcMlsExterior() {
            // Exterior Only: $79 base for 8 images, $10 per additional. No SqFt required.
            let q = parseInt(this.customQty) || 8;
            return 79 + (Math.max(0, q - 8) * 10);
        },
        calcMlsReshoot() {
            // Reshoot: $89 base for 8 images, $10 per additional. No SqFt required.
            let q = parseInt(this.customQty) || 8;
            return 89 + (Math.max(0, q - 8) * 10);
        },
        calcMlsRanch() {
            // Ranch: 25-image base $299, 36-image base $349, $5/additional.
            // Smart-Cap: once overage on 25-base reaches 36-base price ($349), snap to $349.
            let q = parseInt(this.customQty) || 25;
            if (q <= 0) return 0;
            let base25 = 299, base36 = 349;
            if (q >= 36) {
                // Post-36: $349 + $5 per image over 36
                return base36 + (Math.max(0, q - 36) * 5);
            }
            // 25–35: base + overage, capped at base36
            let calculated = base25 + (Math.max(0, q - 25) * 5);
            return Math.min(calculated, base36);
        },
        calcPortPhotos() {
            let q = this.qty;
            if (q <= 0) return 0;
            
            let base = this.portBases[this.brand];
            
            // Tier 1 (1-10)
            if (q <= 2) return base;
            if (q <= 9) return base + ((q - 2) * 20);
            if (q === 10) return base + 150;
            
            // Decade Logic (Q > 10)
            // Determine the decade: 11-20 is decade 1, 21-30 is decade 2, etc.
            let decade = Math.floor((q - 1) / 10); 
            
            // Base price at the start of this decade
            let decadeBase = base + 150 + ((decade - 1) * 100);
            
            // Position within the current decade (1 to 10)
            let unitPlace = q - (decade * 10);
            
            // Plateau Logic: 
            // Units 1-5 increase by $20 each.
            // Units 6-10 are flat (capped at the price of unit 5).
            let overageUnits = Math.min(unitPlace, 5);
            
            return decadeBase + (overageUnits * 20);
        },
        calcAirbnb() {
            let q = this.qty;
            if (q <= 0) return 0;
            return 169 + (Math.max(0, q - 12) * 12);
        },
        calcAddOns() {
            if (!this.selectedAddOn) return 0;
            let basePrices = {
                'Rain Blue Sky': 0, 'Blue Sky': 29, 'Sunset Sky': 29, 'Sky + Grass Bundle': 59,
                'Green Grass': 29, 'Aerial Green Grass': 59, 'AERIAL/GROUND GRASS BUNDLE': 69,
                'YouTube': 29, 'Social Media Teaser': 39, 'TRUEVIEW': 29,
                'Weekend Fee': 29, 'Inclement Weather Return': 39, 'Cancellation Fee': 49,
                'Next Day Rush': 49, 'Same Day Rush': 79, 'Sunrise Time Slot': 79,
                'Twilight Time Slot': 79, 'Night Time Slot': 109, 'TV Screen/Monitor': 29,
                'Home Measurement': 29, 'Keepsake Photo Album': 79, '2 MLS Market Add-On': 25,
                '5 MLS Market Add-On': 50, '10 MLS Market Add-On': 100
            };
            if (this.selectedAddOn === 'Virtual Staging') {
                let q = Math.max(1, this.addOnQty);
                return q >= 4 ? q * 55 : q * 60;
            }
            if (this.selectedAddOn === 'Blue Sky' || this.selectedAddOn === 'Sunset Sky' || this.selectedAddOn === 'Green Grass') {
                return 29 + (Math.max(0, this.addOnQty - 10) * 5);
            }
            if (this.selectedAddOn === 'Aerial Green Grass') {
                return 59 + (Math.max(0, this.addOnQty - 5) * 10);
            }
            if (this.selectedAddOn === 'ColorPop' || this.selectedAddOn === 'Digital Twilight') {
                let base = this.selectedAddOn === 'ColorPop' ? 39 : 29;
                return base + (Math.max(0, this.addOnQty - 1) * 15);
            }
            if (this.selectedAddOn === 'MLS Extended/Hr') {
                return (parseFloat(this.addOnHours) || 0) * 50;
            }
            if (this.selectedAddOn === 'PORT Extended/Hr' || this.selectedAddOn === 'Processing/Hr') {
                return (parseFloat(this.addOnHours) || 0) * 100;
            }
            return basePrices[this.selectedAddOn] || 0;
        },
        calcAerial() {
            if (!this.aerialType) return 0;
            const aerialPath = this.mode.startsWith('MLS') ? 'MLS' : 'PORT';
            const base = this.aerialPrices[aerialPath][this.aerialType] || 0;
            if (base === 0) return 0;

            // Mini-based packages: $15/img overage, max +2 extra (capped at Standard equivalent)
            const miniPackages = [
                'Aerial Mini 2 images',
                'Aerial Mini 2 Images + Curb Appeal Vid 30 sec',
                'Aerial Mini 2 images + Aerial Video 2 min'
            ];
            // Standard-based packages: $10/img overage, no cap
            const standardPackages = [
                'Aerial Standard 5 images',
                'Aerial Standard 5 images + Curb Appeal Vid 30 sec',
                'Aerial Standard 5 images + Aerial Video 2 min'
            ];

            const isPort = this.mode === 'PORT AERIAL';
            const miniRate = isPort ? 20 : 15;
            const stdRate  = isPort ? 20 : 10;

            if (miniPackages.includes(this.aerialType)) {
                // aerialQty is total images (default 2, max 4). Overage above 2.
                const extra = Math.min(Math.max(0, this.aerialQty - 2), 2);
                return base + (extra * miniRate);
            }
            if (standardPackages.includes(this.aerialType)) {
                // aerialQty is total images (default 5). Overage above 5.
                return base + (Math.max(0, this.aerialQty - 5) * stdRate);
            }
            // Fixed packages (video-only, no image toggle): no overage
            return base;
        },
        calcVideo() {
            if (!this.videoType || this.videoType === 'pending') return 0;
            if (this.mode.startsWith('MLS')) return this.videoPrices['MLS'][this.videoType] || 0;
            if (this.mode.startsWith('PORT')) return this.videoPrices['PORT'][this.brand][this.videoType] || 0;
        },
        calcFloorPlan() {
            if (!this.sqft) return 0;
            const pricingType = this.mode.startsWith('MLS') ? 'MLS' : 'PORT';
            let base = this.floorPlanPrices[pricingType][this.sqft][this.planType];
            return this.planType === '3D' ? base * this.numFloors : base;
        },
        calcMatterport() {
            if (!this.sqft) return 0;
            const pricingType = this.mode.startsWith('MLS') ? 'MLS' : 'PORT';
            if (this.sqft === '6000') {
                let s = parseInt(this.mpCustomSqft.toString().replace(/,/g, '')) || 0;
                if (s < 6000) return 0;
                if (pricingType === 'MLS') return this.mpService === 'Standard' ? s * 0.06 : s * 0.10;
                return this.mpService === 'Standard' ? s * 0.11 : s * 0.15;
            }
            return this.matterportPrices[pricingType][this.sqft][this.mpService];
        },
        calcZillow() {
            if (!this.sqft) return 0;
            return this.zillowPrices[this.sqft] || 0;
        },
        get finalTotal() { 
            if (this.selectedAddOn === 'Cancellation Fee') return 49;
            let total = this.includeTax ? this.subtotal * (1 + this.taxRate) : this.subtotal;
            return Math.round(total * 100) / 100;
        },

        // ── Quote Cart ──
        describeCurrentService() {
            const m = this.mode;
            if (m === 'MLS' || m === 'PORT') {
                const pkg = this.mlsPackage ? this.mlsPackage + ' — ' : '';
                const sqftLabel = this.sqft || '';
                const qtyLabel = this.qty ? this.qty + ' imgs' : '';
                return [pkg + (m === 'MLS' ? 'MLS Photos' : 'Port Photos'), sqftLabel, qtyLabel].filter(Boolean).join(' · ');
            }
            if (m === 'AIRBNB') return 'Airbnb — ' + (this.qty || '') + ' imgs';
            if (m.includes('AERIAL')) return (m.includes('MLS') ? 'MLS' : 'PORT') + ' Aerial — ' + (this.aerialType || '');
            if (m.includes('VIDEO')) return (m.includes('MLS') ? 'MLS' : 'PORT') + ' Video — ' + (this.videoType || '');
            if (m.includes('MATTERPORT') || m.includes('ZILLOW')) return '360 Tour — ' + this.mpService + (this.mpCustomSqft ? ' · ' + this.mpCustomSqft + ' sqft' : '');
            if (m.includes('FLOOR PLAN')) return 'Floor Plan — ' + this.planType + ' · ' + this.numFloors + ' floor' + (this.numFloors > 1 ? 's' : '');
            if (m === 'ADD ONS') return this.selectedAddOn || 'Add-On';
            return m;
        },
        addToQuote() {
            if (this.finalTotal <= 0) return;
            this.haptic();
            this.quoteItems.push({
                id: Date.now() + Math.random(),
                description: this.describeCurrentService(),
                subtotal: this.subtotal,
                taxIncluded: this.includeTax
            });
            this.saveQuote();
        },
        addMlsPackageDirect(pkg, defaultQty) {
            // One-tap add at default qty, without requiring the pill to be expanded first.
            this.mlsPackage = pkg; this.sqft = ''; this.selectedTier = 'custom'; this.customQty = String(defaultQty);
            this.addToQuote();
            this.mlsPackage = ''; this.selectedTier = ''; this.customQty = '';
        },
        removeFromQuote(id) {
            this.haptic();
            this.quoteItems = this.quoteItems.filter(i => i.id !== id);
            this.saveQuote();
        },
        clearQuote() {
            this.haptic();
            this.quoteItems = [];
            this.quoteOpen = false;
            this.saveQuote();
        },
        get quoteTotal() {
            const sub = this.quoteItems.reduce((sum, i) => sum + this.itemPrice(i), 0);
            return Math.round(sub * 100) / 100;
        },
        itemPrice(item) {
            const total = item.taxIncluded ? item.subtotal * (1 + this.taxRate) : item.subtotal;
            return Math.round(total * 100) / 100;
        },
        toggleItemTax(id) {
            this.haptic();
            const item = this.quoteItems.find(i => i.id === id);
            if (item) item.taxIncluded = !item.taxIncluded;
            this.saveQuote();
        },
        saveQuote() {
            try { sessionStorage.setItem('pricex_quote', JSON.stringify(this.quoteItems)); } catch(e) {}
        },
        loadQuote() {
            try {
                const saved = sessionStorage.getItem('pricex_quote');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    // Migrate old {price} shaped items (pre tax-toggle) to {subtotal, taxIncluded}
                    this.quoteItems = parsed.map(i => (i.subtotal !== undefined) ? i : {
                        id: i.id, description: i.description, subtotal: i.price || 0, taxIncluded: false
                    });
                }
            } catch(e) {}
        },
        copyQuote() {
            this.haptic();
            const lines = this.quoteItems.map(i => `${i.description} — $${this.itemPrice(i).toFixed(2)}`);
            const text = lines.join('\n') + `\n\nTOTAL: $${this.quoteTotal.toFixed(2)}`;
            if (navigator.clipboard) navigator.clipboard.writeText(text).catch(()=>{});
        }
    };
    }

    function runTests(ctx) { if(!ctx) return;
            // ─────────────────────────────────────────────────────────────
            // PRICEX: Golden Dataset Validation Suite (16 tests)
            // Each test calls resetAll() first to enforce full state isolation.
            // Comparisons use integer cents to avoid floating-point equality bugs.
            // ─────────────────────────────────────────────────────────────
            let passed = 0; let failed = 0;

            const run = (id, label, setup, expected) => {
                ctx.resetAll();
                setup();
                const actual = ctx.subtotal;
                const ok = Math.round(actual * 100) === Math.round(expected * 100);
                ok ? passed++ : failed++;
                console.log(
                    `%c${ok ? '✅' : '❌'} ${id} | ${label} | Expected: $${expected.toFixed(2)} | Actual: $${actual.toFixed(2)}`,
                    ok ? 'color:#16a34a;font-weight:bold' : 'color:#dc2626;font-weight:bold'
                );
            };

            const runFinal = (id, label, setup, taxOn, expected) => {
                ctx.resetAll();
                setup();
                ctx.includeTax = taxOn;
                const actual = ctx.finalTotal;
                const ok = Math.round(actual * 100) === Math.round(expected * 100);
                ok ? passed++ : failed++;
                console.log(
                    `%c${ok ? '✅' : '❌'} ${id} | ${label} | Expected: $${expected.toFixed(2)} | Actual: $${actual.toFixed(2)}`,
                    ok ? 'color:#16a34a;font-weight:bold' : 'color:#dc2626;font-weight:bold'
                );
            };

            console.log('─── PRICEX Golden Dataset ───────────────────────');

            // ── MLS Residential ──────────────────────────────────────────
            run('MLS-01', 'SqFt:2000-2999, Qty:25 → $166 (Standard Base)',
                () => { ctx.mode='MLS'; ctx.sqft='2000-2999'; ctx.selectedTier='custom'; ctx.customQty='25'; },
                166);

            run('MLS-02', 'SqFt:2000-2999, Qty:34 → $206 (Smart-Cap fires)',
                () => { ctx.mode='MLS'; ctx.sqft='2000-2999'; ctx.selectedTier='custom'; ctx.customQty='34'; },
                206);

            run('MLS-03', 'SqFt:0-1999, Qty:60 → $274 (Post-50 overage, no cap)',
                () => { ctx.mode='MLS'; ctx.sqft='0-1999'; ctx.selectedTier='custom'; ctx.customQty='60'; },
                274);

            run('MLS-04', 'SqFt:10000+, Qty:25 → $399 (Max tier base)',
                () => { ctx.mode='MLS'; ctx.sqft='10000+'; ctx.selectedTier='custom'; ctx.customQty='25'; },
                399);

            // ── PORT Portfolio ────────────────────────────────────────────
            run('PRT-01', 'BCD, Qty:2 → $149 (Brand base minimum)',
                () => { ctx.mode='PORT'; ctx.brand='BCD'; ctx.selectedTier='custom'; ctx.customQty='2'; },
                149);

            run('PRT-02', 'BCD, Qty:9 → $289 ($149 + 7×$20)',
                () => { ctx.mode='PORT'; ctx.brand='BCD'; ctx.selectedTier='custom'; ctx.customQty='9'; },
                289);

            run('PRT-03', 'BCD, Qty:10 → $299 (Decade jump flat)',
                () => { ctx.mode='PORT'; ctx.brand='BCD'; ctx.selectedTier='custom'; ctx.customQty='10'; },
                299);

            run('PRT-04', 'BCD, Qty:14 → $379 (Decade 1 + 4×$20)',
                () => { ctx.mode='PORT'; ctx.brand='BCD'; ctx.selectedTier='custom'; ctx.customQty='14'; },
                379);

            run('PRT-05', 'BCD, Qty:18 → $399 (Plateau zone — same as Qty:15)',
                () => { ctx.mode='PORT'; ctx.brand='BCD'; ctx.selectedTier='custom'; ctx.customQty='18'; },
                399);

            run('PRT-06', 'AMF, Qty:22 → $539 (Decade 2 base + 2×$20)',
                () => { ctx.mode='PORT'; ctx.brand='AMF'; ctx.selectedTier='custom'; ctx.customQty='22'; },
                539);

            // ── Add-Ons ───────────────────────────────────────────────────
            run('ADD-01', 'Virtual Staging, 3 images → $180 (Standard $60/ea)',
                () => { ctx.mode='ADD ONS'; ctx.selectedAddOn='Virtual Staging'; ctx.addOnQty=3; },
                180);

            run('ADD-02', 'Virtual Staging, 5 images → $275 (Discount $55/ea at 4+)',
                () => { ctx.mode='ADD ONS'; ctx.selectedAddOn='Virtual Staging'; ctx.addOnQty=5; },
                275);

            run('ADD-03', 'ColorPop, 4 images → $84 ($39 base + 3×$15)',
                () => { ctx.mode='ADD ONS'; ctx.selectedAddOn='ColorPop'; ctx.addOnQty=4; },
                84);

            // ── Matterport ────────────────────────────────────────────────
            // MP-01: Flat tier lookup — sqft range key 3000-3999, Standard
            run('MP-01', 'MLS Matterport, 3000-3999 sqft, Standard → $249',
                () => { ctx.mode='MLS MATTERPORT'; ctx.sqft='3000-3999'; ctx.mpService='Standard'; },
                249);

            // MP-02: Custom sqft path — user selects 6000+ bucket, enters 7000 manually.
            // calcMatterport() branches on sqft===6000 and uses mpCustomSqft x 0.06.
            run('MP-02', 'MLS Matterport, 6000+ bucket (7000 sqft entered), Standard → $420',
                () => { ctx.mode='MLS MATTERPORT'; ctx.sqft='6000'; ctx.mpCustomSqft='7000'; ctx.mpService='Standard'; },
                420);

            // ── Financial / Tax ───────────────────────────────────────────
            // FIN-01: $139 subtotal (MLS 0-1999, 25 photos) × 1.0825 = $150.4675 → rounds to $150.47
            runFinal('FIN-01', 'Tax ON: $139 × 1.0825 → $150.47',
                () => { ctx.mode='MLS'; ctx.sqft='0-1999'; ctx.selectedTier='custom'; ctx.customQty='25'; },
                true, 150.47);

            console.log(`%c\n  Result: ${passed} passed, ${failed} failed out of 16 tests.`,
                failed === 0 ? 'color:#16a34a;font-size:13px;font-weight:bold' : 'color:#dc2626;font-size:13px;font-weight:bold');
            console.log('─── END PRICEX Tests ───────────────────────────');

            ctx.includeTax = false;
            ctx.resetAll();
    }
    </script>
</head>
